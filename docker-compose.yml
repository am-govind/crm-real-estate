services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: landcrm-postgres
    environment:
      POSTGRES_DB: landcrm
      POSTGRES_USER: landcrm
      POSTGRES_PASSWORD: landcrm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - landcrm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: landcrm-redis
    ports:
      - "6379:6379"
    volumes:
      - landcrm_redis_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: landcrm-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  landcrm_postgres_data:
  landcrm_redis_data:
